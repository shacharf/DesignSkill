[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "design-docagent"
version = "0.1.0"
description = "Human-readable hierarchical design workflow"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
docagent = "docagent.cli:main"

[tool.setuptools]
packages = ["docagent"]

[tool.setuptools.package-data]
docagent = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
